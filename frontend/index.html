<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Учебна среда</title>
  <link rel="icon" type="image/jpeg" href="/frontend/assets/bg-logo.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="out">
  <section id="login">
    <form class="box" id="lf">
      <div class="lgo"><img src="assets/logo-large.jpg" alt="Ivan Vazov Austin Bulgarian School logo"></div>
      <h1>Учебна среда <span class="en">Learning Space</span></h1>
      <p class="mute">Българско училище на Остин „Иван Вазов“ · Ivan Vazov Austin Bulgarian School</p>
      <label for="lu">Потребителско име <span class="en">Username</span></label><input id="lu" autocomplete="username">
      <label for="lp">Парола <span class="en">Password</span></label><input id="lp" type="password" autocomplete="current-password">
      <label>Влизам като <span class="en">I am signing in as</span></label>
      <div class="seg">
        <label class="opt"><input type="radio" name="lr" value="s" checked><span>Ученик <span class="en">Student</span></span></label>
        <label class="opt"><input type="radio" name="lr" value="t"><span>Учител <span class="en">Teacher</span></span></label>
      </div>
      <button class="btn" type="submit">Вход <span class="en" style="display:block;color:inherit;opacity:.8">Log in</span></button>
    </form>
  </section>
  <header>
    <div class="brand"><img src="assets/logo-small.jpg" alt="Ivan Vazov Austin Bulgarian School"><h1>Учебна среда <span class="en">Learning Space</span><small>Българско училище на Остин „Иван Вазов“ · прототип · Ivan Vazov Austin Bulgarian School · prototype</small></h1></div>
    <div class="who" role="group" aria-label="Профил">
        <button id="lo">Изход<span class="en">Log out</span></button>
    </div>
  </header>
  <nav role="tablist" id="nav"></nav>
  <main id="main"></main>

  <dialog id="dlg"><form method="dialog" id="dform" onsubmit="return false"></form></dialog>

  <script src="app.js"></script>
</body>
</html>
